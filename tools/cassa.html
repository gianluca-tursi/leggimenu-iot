<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>leggimenu · cassa</title>
<style>
  :root{
    --sfondo:#f5f5f7; --carta:#ffffff; --testo:#1d1d1f; --tenue:#86868b;
    --riga:#e8e8ed; --accento:#0071e3; --verde:#1d8a4e; --ambra:#b25000;
    --ombra:0 1px 2px rgba(0,0,0,.04), 0 6px 20px rgba(0,0,0,.05);
  }
  @media (prefers-color-scheme: dark){
    :root{ --sfondo:#000; --carta:#1c1c1e; --testo:#f5f5f7; --tenue:#8e8e93;
           --riga:#2c2c2e; --accento:#0a84ff; --verde:#30d158; --ambra:#ff9f0a;
           --ombra:none; }
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--sfondo);color:var(--testo);
    font:15px/1.5 -apple-system,BlinkMacSystemFont,"SF Pro Text",system-ui,sans-serif;
    -webkit-font-smoothing:antialiased}
  .pagina{max-width:860px;margin:0 auto;padding:32px 16px 80px}
  header{display:flex;align-items:baseline;justify-content:space-between;
    gap:16px;margin-bottom:26px;flex-wrap:wrap}
  h1{font-size:27px;letter-spacing:-.022em;font-weight:600;margin:0}
  .sottotitolo{color:var(--tenue);font-size:14px}
  .carta{background:var(--carta);border-radius:18px;padding:22px;
    box-shadow:var(--ombra);margin-bottom:16px}
  .stato{display:flex;align-items:center;gap:14px;margin-bottom:4px}
  .pallino{width:10px;height:10px;border-radius:5px;background:var(--tenue);
    flex:0 0 auto}
  .pallino.vivo{background:var(--verde);box-shadow:0 0 0 4px rgba(48,209,88,.18)}
  .titolone{font-size:24px;font-weight:600;letter-spacing:-.02em}
  .numeri{display:grid;grid-template-columns:repeat(auto-fit,minmax(118px,1fr));
    gap:1px;background:var(--riga);border-radius:14px;overflow:hidden;margin-top:18px}
  .numero{background:var(--carta);padding:15px 16px}
  .numero .v{font-size:25px;font-weight:600;letter-spacing:-.02em;
    font-variant-numeric:tabular-nums}
  .numero .e{color:var(--tenue);font-size:12px;margin-top:2px}
  h2{font-size:13px;font-weight:600;color:var(--tenue);text-transform:uppercase;
    letter-spacing:.06em;margin:28px 4px 10px}
  .evento{display:flex;gap:14px;padding:13px 0;border-top:1px solid var(--riga)}
  .evento:first-child{border-top:0}
  .ora{color:var(--tenue);font-size:13px;font-variant-numeric:tabular-nums;
    flex:0 0 46px;padding-top:1px}
  .corpo{flex:1;min-width:0}
  .corpo b{font-weight:600}
  .dettaglio{color:var(--tenue);font-size:13px;margin-top:2px}
  .segno{flex:0 0 26px;text-align:center;font-size:15px;padding-top:1px}
  .vuoto{color:var(--tenue);padding:6px 0}
  .pulsante{appearance:none;border:0;border-radius:11px;padding:13px 20px;
    background:var(--accento);color:#fff;font-size:15px;font-weight:500;
    font-family:inherit;cursor:pointer;width:100%;margin-top:18px}
  .pulsante.quieto{background:transparent;color:var(--accento);
    box-shadow:inset 0 0 0 1px var(--riga)}
  .pulsante:active{opacity:.75}
  .riga-piatto{display:flex;justify-content:space-between;gap:12px;
    padding:3px 0;font-size:14px}
  .riga-piatto span{color:var(--tenue);font-variant-numeric:tabular-nums}

  .velo{position:fixed;inset:0;background:rgba(0,0,0,.35);backdrop-filter:blur(3px);
    display:none;align-items:center;justify-content:center;padding:20px;z-index:9}
  .velo.aperto{display:flex}
  .modale{background:var(--carta);border-radius:20px;padding:26px 24px;
    max-width:380px;width:100%;box-shadow:0 20px 60px rgba(0,0,0,.25);
    animation:sali .22s ease-out}
  @keyframes sali{from{opacity:0;transform:translateY(14px) scale(.98)}}
  .modale h3{margin:0 0 6px;font-size:21px;font-weight:600;letter-spacing:-.02em}
  .modale p{margin:0 0 20px;color:var(--tenue);font-size:14px}
  .scelte{display:grid;grid-template-columns:repeat(4,1fr);gap:9px;margin-bottom:20px}
  .scelte button{appearance:none;border:1px solid var(--riga);background:transparent;
    color:var(--testo);border-radius:13px;padding:15px 0;font-size:18px;
    font-weight:600;font-family:inherit;cursor:pointer;font-variant-numeric:tabular-nums}
  .scelte button.scelto{background:var(--accento);border-color:var(--accento);color:#fff}
  .modale .fondo{display:flex;gap:9px}
  .modale .fondo button{flex:1}

  .etichetta{display:inline-block;padding:4px 11px;border-radius:99px;
    font-size:12px;font-weight:600;letter-spacing:.01em;
    background:var(--riga);color:var(--tenue)}
  .etichetta.attesa{background:rgba(255,159,10,.16);color:var(--ambra)}
  .etichetta.fatto {background:rgba(48,209,88,.16);color:var(--verde)}
  .attesaGrande{font-size:34px;font-weight:600;letter-spacing:-.022em;
    font-variant-numeric:tabular-nums;margin:14px 0 2px}
  .attesaGrande.tardi{color:var(--ambra)}
  .attesaGrande.molto{color:#d7263d}
  @media (prefers-color-scheme: dark){ .attesaGrande.molto{color:#ff6b6b} }
  .azioni{display:flex;gap:9px;margin-top:18px;flex-wrap:wrap}
  .azioni .pulsante{width:auto;flex:1 1 auto;min-width:138px;margin-top:0}
  .piatti{margin-top:12px;padding-top:12px;border-top:1px solid var(--riga)}

  .linea{display:flex;align-items:flex-start;margin:4px 0 2px;overflow-x:auto;
    padding-bottom:4px}
  .tappa{flex:0 0 auto;text-align:center;min-width:62px}
  .bollo{width:13px;height:13px;border-radius:7px;margin:0 auto 7px;
    background:var(--riga);border:2px solid var(--carta);
    box-shadow:0 0 0 2px var(--riga)}
  .tappa.fatta .bollo{background:var(--verde);box-shadow:0 0 0 2px var(--verde)}
  .tappa.ora .bollo{background:var(--accento);box-shadow:0 0 0 4px rgba(10,132,255,.22)}
  .tappa .nome{font-size:11.5px;font-weight:600;letter-spacing:-.01em}
  .tappa.futura .nome{color:var(--tenue);font-weight:500}
  .tappa .quando{font-size:11px;color:var(--tenue);font-variant-numeric:tabular-nums}
  .ponte{flex:1 1 auto;min-width:18px;text-align:center;padding-top:5px}
  .ponte .tratto{height:2px;background:var(--riga);margin-bottom:5px}
  .ponte.fatto .tratto{background:var(--verde)}
  .ponte .delta{font-size:10.5px;color:var(--tenue);font-variant-numeric:tabular-nums}
</style>
</head>
<body>
<div class="pagina">

  <header>
    <div>
      <h1>leggimenu</h1>
      <div class="sottotitolo">gestionale cassa</div>
    </div>
    <div class="sottotitolo" id="collegamento">collegamento…</div>
  </header>

  <div class="carta">
    <div class="linea" id="linea"></div>
  </div>

  <div class="carta">
    <div class="stato">
      <div class="pallino" id="pallino"></div>
      <div class="titolone" id="statoTavolo">Tavolo libero</div>
    </div>
    <div class="sottotitolo" id="statoNota">in attesa che qualcuno si sieda</div>

    <div class="numeri">
      <div class="numero"><div class="v" id="nCoperti">—</div><div class="e">coperti</div></div>
      <div class="numero"><div class="v" id="nDisp">—</div><div class="e">telefoni</div></div>
      <div class="numero"><div class="v" id="nRiap">—</div><div class="e">riaperture</div></div>
      <div class="numero"><div class="v" id="nOrdini">—</div><div class="e">ordini</div></div>
      <div class="numero"><div class="v" id="nTotale">—</div><div class="e">euro</div></div>
      <div class="numero"><div class="v" id="nDurata">—</div><div class="e">a tavola</div></div>
    </div>

    <div class="sottotitolo" id="notaScansioni" style="margin-top:12px"></div>

    <button class="pulsante quieto" id="rimettiQr">Rimetti il QR del menu sul tavolo</button>
    <button class="pulsante" id="libera">Il pasto è finito · libera il tavolo</button>
  </div>

  <div class="carta" id="cartaOrdine" style="display:none">
    <span class="etichetta" id="etichettaStato">ordine inviato</span>
    <div class="attesaGrande" id="attesa">—</div>
    <div class="sottotitolo" id="attesaNota"></div>
    <div class="piatti" id="piattiOrdine"></div>
    <div class="azioni" id="azioni"></div>
  </div>

  <div class="velo" id="velo">
    <div class="modale">
      <h3>Qualcuno si è seduto</h3>
      <p id="modaleNota">Il sensore ne ha rilevato uno. Quanti sono davvero?</p>
      <div class="scelte" id="scelte"></div>
      <div class="fondo">
        <button class="pulsante quieto" id="annullaApertura">Non è nessuno</button>
        <button class="pulsante" id="confermaApertura">Apri il tavolo</button>
      </div>
    </div>
  </div>

  <h2>Cos'è successo</h2>
  <div class="carta" id="storia"><div class="vuoto">ancora niente</div></div>

</div>
<script>
const SEGNI = {aperto:'●', coperti:'●', scansione:'◆', ordine:'■',
               stato:'▸', vino:'◇', confermati:'✓', liberato:'○'};
let apertoDa = null, ordini = 0, totale = 0, coperti = 0, telefoni = 0;
let riaperture = 0, ogniSec = 0;
const storia = document.getElementById('storia');
let righe = [];

const q = id => document.getElementById(id);
const euro = n => (Math.round(n*100)/100).toLocaleString('it-IT');

function durata(){
  if(!apertoDa) return '—';
  const s = Math.floor((Date.now()-apertoDa)/1000);
  const m = Math.floor(s/60);
  return m < 60 ? m+"'" : Math.floor(m/60)+'h'+String(m%60).padStart(2,'0');
}
setInterval(()=>{ q('nDurata').textContent = durata(); }, 10000);

function aggiorna(){
  q('nCoperti').textContent = coperti || '—';
  q('nDisp').textContent    = telefoni || '—';
  q('nRiap').textContent    = riaperture || '—';
  q('nOrdini').textContent  = ordini || '—';
  q('nTotale').textContent  = totale ? euro(totale) : '—';
  q('nDurata').textContent  = durata();
  q('notaScansioni').textContent = ogniSec
    ? (ogniSec < 60 ? `riaprono il menu ogni ${ogniSec} secondi in media`
                    : `riaprono il menu ogni ${Math.round(ogniSec/60)} minuti in media`)
    : '';
  const vivo = !!apertoDa;
  q('pallino').classList.toggle('vivo', vivo);
  q('statoTavolo').textContent = vivo ? `Tavolo occupato` : 'Tavolo libero';
  q('statoNota').textContent = vivo
    ? `${coperti} ${coperti===1?'coperto':'coperti'} · aperto alle ${apertoOra||'—'}`
    : 'in attesa che qualcuno si sieda';
}
let apertoOra = null;

function disegna(){
  if(!righe.length){ storia.innerHTML = '<div class="vuoto">ancora niente</div>'; return; }
  storia.innerHTML = righe.slice().reverse().map(r=>`
    <div class="evento">
      <div class="ora">${r.ora}</div>
      <div class="segno">${SEGNI[r.evento]||'·'}</div>
      <div class="corpo"><b>${r.titolo}</b>
        ${r.dettaglio?`<div class="dettaglio">${r.dettaglio}</div>`:''}</div>
    </div>`).join('');
}

function evento(m){
  let titolo = '', dettaglio = '';
  if(m.evento==='aperto'){
    apertoDa = Date.now(); apertoOra = m.ora; coperti = m.coperti;
    segna('aperto', m.ts);
    apriModale(m.coperti);
    titolo = 'Tavolo aperto';
    dettaglio = `${m.coperti} ${m.coperti===1?'coperto rilevato':'coperti rilevati'}`;
  } else if(m.evento==='coperti'){
    coperti = m.coperti;
    titolo = 'Coperti aggiornati'; dettaglio = `ora sono ${m.coperti}`;
  } else if(m.evento==='scansione'){
    telefoni = m.dispositivi; riaperture = m.riaperture||0; ogniSec = m.ogni||0;
    titolo = m.nuovo ? 'Menu aperto da un nuovo telefono' : 'Menu riaperto';
    const pezzi = [`${m.dispositivi} ${m.dispositivi===1?'telefono':'telefoni'}`];
    if(m.scansioni>m.dispositivi) pezzi.push(`${m.scansioni} aperture in tutto`);
    if(ogniSec) pezzi.push(ogniSec<60 ? `riaprono ogni ${ogniSec} secondi`
                                      : `riaprono ogni ${Math.round(ogniSec/60)} minuti`);
    dettaglio = pezzi.join(' · ');
  } else if(m.evento==='ordine'){
    ordini++; totale += (m.totale||0);
    segna('ordine', m.ts);
    titolo = 'Ordine inviato in cucina';
    dettaglio = m.righe.map(r=>`${r.qta}× ${r.nome}`).join(' · ')
              + (m.totale?` — ${euro(m.totale)} euro`:'');
  } else if(m.evento==='vino'){
    titolo = 'Abbinamento proposto';
    dettaglio = `${m.nome} (${m.colore}) · ${m.quanto} — ${m.motivo}`;
  } else if(m.evento==='confermati'){
    coperti = m.coperti; tavoloConfermato = true;
    titolo = 'Coperti confermati in sala';
    dettaglio = `${m.coperti} ${m.coperti===1?'coperto':'coperti'}`;
  } else if(m.evento==='stato'){
    if(['servito','conto','pagato'].includes(m.stato)) segna(m.stato, m.ts);
    const f = FLUSSO[m.stato];
    titolo = f ? f.nome.charAt(0).toUpperCase()+f.nome.slice(1) : m.stato;
    const mm = Math.round((m.atteso||0)/60);
    dettaglio = mm>=1 ? `dopo ${mm} ${mm===1?'minuto':'minuti'} di attesa` : 'subito';
  } else if(m.evento==='liberato'){
    const d = m.durata||0;
    titolo = 'Tavolo liberato';
    dettaglio = d ? `servizio durato ${Math.round(d/60)} minuti` : '';
    apertoDa = null; apertoOra = null; coperti = 0; telefoni = 0;
    ordini = 0; totale = 0; riaperture = 0; ogniSec = 0;
    tavoloConfermato = false; chiudiModale();
    ordineVivo = null; disegnaOrdine();
    righe = [];                       // servizio chiuso, la cassa riparte pulita
    Object.keys(raggiunte).forEach(k => delete raggiunte[k]);
    disegnaLinea();
    righe.push({...m, titolo, dettaglio});
    disegna(); aggiorna(); return;
  } else return;
  righe.push({...m, titolo, dettaglio});
  disegna(); aggiorna();
}

// Il percorso vero di una sala. Per ogni stato: come si chiama, cosa dice il
// cronometro, e cosa puo' fare chi guarda adesso.
const FLUSSO = {
  inviato:      {nome:'ordine inviato',    nota:'in attesa che la cucina lo prenda in carico',
                 azioni:[['preparazione','Presa in carico dalla cucina']]},
  preparazione: {nome:'in preparazione',   nota:'in preparazione da',
                 azioni:[['servito','Servito al tavolo']]},
  servito:      {nome:'servito',           nota:'servito da',
                 azioni:[['conto','Porta il conto']]},
  conto:        {nome:'conto richiesto',   nota:'conto chiesto da',
                 azioni:[['pagato','Conto pagato']]},
  pagato:       {nome:'pagato',            nota:'pagato da',
                 azioni:[]},
};
let ordineVivo = null;

// Le tappe della vita di un tavolo. Quello che interessa in sala non e'
// l'elenco di tutto quello che e' successo, ma a che punto siamo e da quanto.
const TAPPE = [
  {chiave:'aperto',  nome:'Aperto'},
  {chiave:'ordine',  nome:'Ordine'},
  {chiave:'servito', nome:'Servito'},
  {chiave:'conto',   nome:'Conto'},
  {chiave:'pagato',  nome:'Pagato'},
];
const raggiunte = {};              // chiave -> secondi

function breve(sec){
  if(sec < 60) return sec + 's';
  const m = Math.round(sec/60);
  return m < 60 ? m + "'" : Math.floor(m/60) + 'h' + String(m%60).padStart(2,'0');
}
function orario(sec){
  return new Date(sec*1000).toLocaleTimeString('it-IT',
    {hour:'2-digit', minute:'2-digit'});
}

function disegnaLinea(){
  const fatte = TAPPE.filter(t => raggiunte[t.chiave] !== undefined);
  const ultima = fatte.length ? fatte[fatte.length-1].chiave : null;
  let html = '';
  TAPPE.forEach((t, i) => {
    const ts = raggiunte[t.chiave];
    const classe = ts === undefined ? 'futura' : (t.chiave === ultima ? 'ora fatta' : 'fatta');
    if(i){
      const prima = raggiunte[TAPPE[i-1].chiave];
      const delta = (ts !== undefined && prima !== undefined) ? breve(Math.round(ts - prima)) : '';
      html += `<div class="ponte ${ts!==undefined?'fatto':''}">
                 <div class="tratto"></div><div class="delta">${delta}</div></div>`;
    }
    html += `<div class="tappa ${classe}"><div class="bollo"></div>
               <div class="nome">${t.nome}</div>
               <div class="quando">${ts!==undefined?orario(ts):'—'}</div></div>`;
  });
  document.getElementById('linea').innerHTML = html;
}
disegnaLinea();

function segna(chiave, ts){
  if(raggiunte[chiave] === undefined){ raggiunte[chiave] = ts; disegnaLinea(); }
}

function minuti(da){ return Math.floor((Date.now()/1000 - da)/60); }

function disegnaOrdine(){
  const c = q('cartaOrdine');
  if(!ordineVivo){ c.style.display='none'; return; }
  c.style.display='';
  const f = FLUSSO[ordineVivo.stato] || FLUSSO.inviato;
  const m = minuti(ordineVivo.da);

  const et = q('etichettaStato');
  et.textContent = f.nome;
  et.className = 'etichetta ' + (ordineVivo.stato==='inviato' ? 'attesa'
                               : ordineVivo.stato==='servito' ? 'fatto' : '');

  const a = q('attesa');
  a.textContent = m < 1 ? 'adesso' : `da ${m} ${m===1?'minuto':'minuti'}`;
  // Dopo un quarto d'ora un ordine fermo e' un cliente che si innervosisce.
  a.className = 'attesaGrande' + (m>=20 ? ' molto' : m>=10 ? ' tardi' : '');
  q('attesaNota').textContent =
    ordineVivo.stato==='inviato' ? f.nota : '';

  q('piattiOrdine').innerHTML = ordineVivo.righe.map(r=>
    `<div class="riga-piatto"><div>${r.qta}× ${r.nome}</div>
     <span>${euro(r.qta*(r.prezzo||0))}</span></div>`).join('')
    + `<div class="riga-piatto" style="margin-top:6px"><b>totale</b>
       <span><b>${euro(ordineVivo.totale||0)}</b></span></div>`;

  q('azioni').innerHTML = f.azioni.map(([s,testo])=>
    `<button class="pulsante" data-stato="${s}">${testo}</button>`).join('')
    || '<div class="sottotitolo">niente altro da fare qui</div>';
}
setInterval(disegnaOrdine, 15000);

q('azioni').onclick = async e=>{
  const b = e.target.closest('button[data-stato]'); if(!b) return;
  b.disabled = true;
  try{
    await fetch('/api/ordine/stato',{method:'POST',
      headers:{'Content-Type':'application/json'},
      body:JSON.stringify({stato:b.dataset.stato})});
  }catch(err){ b.disabled = false; }
};

// Il radar propone, il cameriere decide. E' anche il modo onesto di convivere
// col limite del sensore, che attorno a un tavolo rotondo vede meno persone di
// quante ce ne siano: chi e' in sala li ha contati guardandoli.
let scelto = 0, tavoloConfermato = false;

function apriModale(rilevati){
  if(tavoloConfermato) return;
  scelto = Math.max(1, rilevati || 1);
  q('modaleNota').textContent = rilevati
    ? `Il sensore ne ha rilevat${rilevati===1?'o uno':'i '+rilevati}. Quanti sono davvero?`
    : 'Quante persone si sono sedute?';
  q('scelte').innerHTML = [1,2,3,4,5,6,7,8].map(n=>
    `<button data-n="${n}" class="${n===scelto?'scelto':''}">${n}</button>`).join('');
  q('velo').classList.add('aperto');
}
function chiudiModale(){ q('velo').classList.remove('aperto'); }

q('scelte').onclick = e=>{
  const b = e.target.closest('button[data-n]'); if(!b) return;
  scelto = +b.dataset.n;
  [...q('scelte').children].forEach(x=>
    x.classList.toggle('scelto', x === b));
};

q('confermaApertura').onclick = async ()=>{
  tavoloConfermato = true; chiudiModale();
  try{
    await fetch('/api/coperti',{method:'POST',
      headers:{'Content-Type':'application/json'}, body:JSON.stringify({n:scelto})});
  }catch(e){}
};

q('annullaApertura').onclick = async ()=>{
  chiudiModale();
  // Non era nessuno: chiudo il tavolo invece di lasciarlo aperto a vuoto.
  try{ await fetch('/api/libera',{method:'POST'}); }catch(e){}
};

function collega(){
  const ws = new WebSocket(`ws://${location.host}/ws`);
  ws.onopen = ()=> q('collegamento').textContent = 'collegato';
  ws.onclose = ()=>{
    q('collegamento').textContent = 'riconnessione…';
    setTimeout(collega, 2000);
  };
  ws.onmessage = e=>{
    const m = JSON.parse(e.data);
    if(m.tipo === 'evento') evento(m);
    else if(m.tipo === 'ordine_stato'){
      ordineVivo = m.righe ? m : null;
      disegnaOrdine();
    }
  };
}
collega();

q('rimettiQr').onclick = async ()=>{
  const b = q('rimettiQr'); b.disabled = true;
  try{ await fetch('/api/menu',{method:'POST'}); }catch(e){}
  // L'e-ink ci mette qualche secondo: tenerlo spento evita che lo ripremano.
  setTimeout(()=>{ b.disabled = false; }, 5000);
};
